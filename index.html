<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Peny Toolkit</title>
  <style>
    /* Four looks, picked in the panel (S, or the brush button) and remembered per Mac:
         glass   - the dashboard Lee liked: black fading to white, frosted cards, pills
         studio  - calmer, Resolve / Final Cut-like: charcoal, flat cards, square-ish buttons (default, Lee 30 Oct)
         bold    - high contrast black and white, big type, chunky outlines
         compact - the dense inspector of 30 Oct morning, for small panels
       Each look only sets the variables below; every rule uses them. Colour means something
       in all of them: blue = active / selected, green = running, amber = paused, red = failed
       or destructive. Motion (M toggles; off when the Mac asks for reduced motion) is short
       and only on touch: tile press, view slide, list entrance, bar shimmer while running.
       Skill modules style their own bits with --glass*, --text, --dim, --faint, .pill,
       .segmented, .field: those names are kept. */
    :root, body[data-style=glass] {
      --fs: 15px; --fs-s: 13.5px; --fs-xs: 12.5px; --fs-title: 18px; --lh: 1.4;
      --font: "SF Pro Rounded", "Avenir Next", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --btn: 38px; --btn-pad: 18px; --input: 36px; --pad: 14px; --gap: 12px;
      --r-btn: 999px; --r-input: 12px; --r-card: 20px; --r-tile: 16px;
      --tile: 64px; --tile-svg: 46px; --tile-col: 92px; --row-icon: 36px;
      --page: linear-gradient(180deg, #000 0%, #000 58%, #161616 74%, #5a5a5a 90%, #bdbdbd 100%);
      --card: rgba(255, 255, 255, 0.06); --card-line: rgba(255, 255, 255, 0.16); --blur: blur(24px) saturate(160%);
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --field: rgba(0, 0, 0, 0.3); --line: rgba(255, 255, 255, 0.16); --line-soft: rgba(255, 255, 255, 0.08);
      --bar-bg: rgba(255, 255, 255, 0.04); --pane: rgba(0, 0, 0, 0.55);
      --tile-bg: linear-gradient(160deg, #1c1c1e, #000); --tile-line: rgba(255, 255, 255, 0.22);
      --tile-shadow: 0 6px 16px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      --text: #fff; --dim: rgba(255, 255, 255, 0.68); --faint: rgba(255, 255, 255, 0.42);
      --surface-2: rgba(255, 255, 255, 0.1); --surface-3: rgba(255, 255, 255, 0.16);
      --primary: #fff; --primary-text: #000; --label-case: none;
    }
    body[data-style=studio] {
      --fs: 14.5px; --fs-s: 13px; --fs-xs: 12px; --fs-title: 16px; --lh: 1.4;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      --btn: 36px; --btn-pad: 14px; --input: 34px; --pad: 12px; --gap: 10px;
      --r-btn: 8px; --r-input: 6px; --r-card: 10px; --r-tile: 12px;
      --tile: 56px; --tile-svg: 40px; --tile-col: 84px; --row-icon: 32px;
      --page: linear-gradient(180deg, #1e1f22 0%, #1e1f22 62%, #26282c 80%, #4a4d52 100%);
      --card: #26282c; --card-line: #33363b; --blur: none; --card-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset;
      --field: #1a1b1e; --line: #3a3d42; --line-soft: #2e3034; --bar-bg: #232528; --pane: #18191b;
      --tile-bg: #000; --tile-line: #3c3f44; --tile-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      --text: #e8eaed; --dim: #a3a8af; --faint: #6f747c;
      --surface-2: #2f3237; --surface-3: #3a3d43;
      --primary: #e9ebee; --primary-text: #111; --label-case: none;
    }
    body[data-style=bold] {
      --fs: 15.5px; --fs-s: 13.5px; --fs-xs: 12.5px; --fs-title: 19px; --lh: 1.35;
      --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --btn: 42px; --btn-pad: 18px; --input: 40px; --pad: 16px; --gap: 14px;
      --r-btn: 6px; --r-input: 6px; --r-card: 8px; --r-tile: 10px;
      --tile: 68px; --tile-svg: 48px; --tile-col: 96px; --row-icon: 38px;
      --page: linear-gradient(180deg, #000 0%, #000 66%, #1a1a1a 80%, #6b6b6b 93%, #d6d6d6 100%);
      --card: #0b0b0b; --card-line: rgba(255, 255, 255, 0.28); --blur: none; --card-shadow: none;
      --field: #000; --line: rgba(255, 255, 255, 0.3); --line-soft: rgba(255, 255, 255, 0.12); --bar-bg: #000; --pane: #000;
      --tile-bg: #000; --tile-line: #fff; --tile-shadow: none;
      --text: #fff; --dim: rgba(255, 255, 255, 0.74); --faint: rgba(255, 255, 255, 0.5);
      --surface-2: #161616; --surface-3: #262626;
      --primary: #fff; --primary-text: #000; --label-case: uppercase;
    }
    body[data-style=compact] {
      --fs: 12px; --fs-s: 11.5px; --fs-xs: 11px; --fs-title: 12.5px; --lh: 1.35;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      --btn: 24px; --btn-pad: 10px; --input: 24px; --pad: 8px; --gap: 6px;
      --r-btn: 3px; --r-input: 3px; --r-card: 4px; --r-tile: 4px;
      --tile: 44px; --tile-svg: 34px; --tile-col: 76px; --row-icon: 26px;
      --page: #1c1d20;
      --card: #232528; --card-line: #2c2e32; --blur: none; --card-shadow: none;
      --field: #1c1d20; --line: #383b40; --line-soft: #2c2e32; --bar-bg: #232528; --pane: #1c1d20;
      --tile-bg: #000; --tile-line: #3a3c40; --tile-shadow: none;
      --text: #e2e4e7; --dim: #9da2a9; --faint: #6c7179;
      --surface-2: #2a2c30; --surface-3: #34373c;
      --primary: #e9ebee; --primary-text: #111; --label-case: none;
    }
    :root {
      --accent: #3b8cff; --accent-soft: rgba(59, 140, 255, 0.18);
      --live: #34c46a; --warn: #f0ad3c; --red: #ff4d42;
      --mono: "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --ease: cubic-bezier(0.23, 1, 0.32, 1); --spring: cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    body { --glass: var(--card); --glass-strong: var(--surface-3); --glass-line: var(--line); --surface: var(--card);
           --bg: transparent; --blue: var(--accent); --blue-hi: var(--accent); --green: var(--live); --orange: var(--warn); --radius: var(--r-card); }
    * { box-sizing: border-box; }
    body[data-motion=off] *, body[data-motion=off] *::before, body[data-motion=off] *::after { transition: none !important; animation: none !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--text); overflow: hidden; display: flex; flex-direction: column;
      background: var(--page); background-color: #000; background-attachment: fixed;
      font: var(--fs)/var(--lh) var(--font); -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    /* Panel text is not selectable (no accidental highlights while clicking); typing boxes,
       the log, the history and status lines still are, so they can be copied. */
    body { -webkit-user-select: none; user-select: none; }
    input, textarea, #log, #history, .status, .info-body { -webkit-user-select: text; user-select: text; }

    /* Opening an app (FLIP, like an iPhone): a squircle the colour of the icon grows from the
       tapped icon to fill the panel, the home screen sinks behind it, the app fades in; Back
       or the home bar runs it in reverse. Only transform and opacity move (GPU, no layout),
       with Apple's curve. main.js drives it (flipOpen / flipClose). */
    :root { --ios: cubic-bezier(0.32, 0.72, 0, 1); }
    /* The ghost is the colour of the app's screen; the black icon face on top of it fades
       out as it grows, so the panel never goes dark mid-way (Studio's charcoal flashed black). */
    .flip-ghost { position: fixed; z-index: 6; transform-origin: 0 0; will-change: transform, opacity; pointer-events: none;
                  background: var(--ghost, #1e1f22); border: 1px solid var(--tile-line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .flip-ghost .face { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: var(--tile-bg); display: flex; align-items: center; justify-content: center; }
    body[data-style=glass] { --ghost: #0a0a0a; } body[data-style=studio] { --ghost: #222327; } body[data-style=bold] { --ghost: #000; } body[data-style=compact] { --ghost: #1c1d20; }
    #home.flip-keep { display: block !important; pointer-events: none; }
    #detail.flip-keep { display: flex !important; pointer-events: none; }
    #detail { display: flex; flex-direction: column; }
    #detail > #apps { flex: none; }
    body.flipping .tile { animation: none !important; }
    /* Home bar at the foot of every app, like the iPhone's: click to go home */
    #homebar { position: sticky; bottom: 0; flex: none; display: flex; justify-content: center; align-items: flex-end; width: 100%; height: 22px; margin-top: auto;
               padding: 0 0 6px; background: none; border: 0; cursor: pointer; z-index: 2; }
    #homebar span { width: 120px; max-width: 40%; height: 5px; border-radius: 3px; background: var(--dim); opacity: 0.55; transition: opacity 0.15s, transform 0.2s var(--spring); }
    #homebar:hover span { opacity: 1; transform: scaleX(1.08); }
    body[data-style=compact] #homebar { display: none; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    kbd { font: 10px/1 var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .glass { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r-card); box-shadow: var(--card-shadow);
             -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

    /* Header strip: back, logo, where you are, state chip, view tools */
    #bar { flex: none; height: calc(var(--fs) * 2.6 + 6px); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; }
    #bar .logo { display: block; height: calc(var(--fs) * 2); width: auto; flex: none; cursor: pointer; }
    body[data-view=home] #bar .logo { height: calc(var(--fs) * 2.4); }
    .crumb { display: flex; align-items: baseline; gap: 8px; min-width: 40px; flex: 1 1 auto; }
    .crumb .sep { color: var(--faint); }
    #home-title { font-weight: 700; font-size: calc(var(--fs-title) * 1.3); letter-spacing: -0.01em; }
    body[data-style=compact] #home-title { font-size: var(--fs-title); }
    body[data-view=detail] #home-title, body[data-view=detail] .crumb .sep { display: none; }
    body[data-view=home] #nav-icon, body[data-view=home] #nav-title, body[data-view=home] #back, body[data-view=home] .crumb .sep { display: none; }
    /* The dashboard stands alone on the fade, as before; the Log / History pane joins in an app
       (Compact keeps it everywhere; H opens it on home too). */
    body[data-view=home]:not([data-style=compact]):not(.pane-home) #aux, body[data-view=home]:not([data-style=compact]):not(.pane-home) #split { display: none; }
    @media (max-width: 420px) { #btn-layout, #btn-keys { display: none; } }
    body[data-view=detail] #status { display: none; }
    #status { color: var(--faint); font-size: var(--fs-xs); white-space: nowrap; }
    #nav-title { font-weight: 600; font-size: var(--fs-title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; align-self: center; }
    .ib { flex: none; width: calc(var(--btn) * 0.9); height: calc(var(--btn) * 0.9); padding: 0; display: inline-flex; align-items: center; justify-content: center;
          background: none; border: 1px solid transparent; border-radius: min(var(--r-btn), 10px); color: var(--dim); cursor: pointer;
          transition: background 0.15s var(--ease), color 0.15s var(--ease), transform 0.2s var(--spring); }
    .ib:hover { background: var(--surface-2); color: var(--text); }
    .ib:active { transform: scale(0.9); }
    .ib.on { color: var(--accent); }
    .ib svg { width: calc(var(--fs) + 2px); height: calc(var(--fs) + 2px); }
    #back { border-color: var(--line); background: var(--card); border-radius: 999px; }
    .tools { display: flex; gap: 0; flex: none; }

    /* State chip: Ready / Running / Rendering / Paused / Failed */
    .chip { display: inline-flex; align-items: center; gap: 6px; height: calc(var(--fs) + 9px); padding: 0 9px; border-radius: 999px; flex: 0 1 auto; min-width: 0;
            font-size: var(--fs-xs); color: var(--dim); background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line-soft); white-space: nowrap;
            max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
    .chip::before { content: ""; width: 7px; height: 7px; border-radius: 4px; background: var(--faint); flex: none; }
    .chip.live::before { background: var(--live); }
    .chip.run { color: var(--text); } .chip.run::before { background: var(--live); animation: breathe 1.6s ease-in-out infinite; }
    .chip.paused::before { background: var(--warn); }
    .chip.fail { color: var(--red); } .chip.fail::before { background: var(--red); }
    .chip:empty { display: none; }
    @keyframes breathe { 50% { box-shadow: 0 0 0 4px rgba(52, 196, 106, 0.18); } }
    @media (max-width: 380px) { .chip { font-size: 0; gap: 0; padding: 0 6px; } #status { display: none; } }

    /* Work area: main pane + log/history pane (bottom, side or hidden; drag the splitter) */
    #work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #work.side { flex-direction: row; }
    #main { flex: 1; min-height: 0; min-width: 0; position: relative; }
    .view { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow-y: auto; padding: 4px var(--pad) var(--pad); }
    #split { flex: none; height: 6px; cursor: row-resize; }
    #work.side #split { height: auto; width: 6px; cursor: col-resize; }
    #split:hover, #split.drag { background: var(--accent-soft); }
    #aux { flex: none; height: 150px; min-height: 60px; display: flex; flex-direction: column; margin: 0 var(--pad) var(--pad);
           background: var(--pane); border: 1px solid var(--line-soft); border-radius: var(--r-card); overflow: hidden; }
    #work.side #aux { height: auto; width: 300px; min-width: 180px; margin: 4px var(--pad) var(--pad) 0; }
    #work.nolog #aux, #work.nolog #split { display: none; }
    .auxbar { flex: none; height: calc(var(--fs) * 2.2); display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line-soft); }
    .auxbar .tab { height: 100%; padding: 0 10px; border: 0; background: none; color: var(--faint); cursor: pointer; font-size: var(--fs-s); font-weight: 600; }
    .auxbar .tab:hover { color: var(--text); }
    .auxbar .tab.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
    .auxbar .grow { flex: 1; }
    .auxbar .hint { color: var(--faint); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #log { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 10px; font: var(--fs-xs)/1.5 var(--mono); white-space: pre-wrap; color: var(--dim); word-break: break-word; }
    .ok { color: var(--text) !important; } .err { color: var(--red) !important; } .warn { color: var(--faint) !important; }

    #history { flex: 1; min-height: 0; overflow-y: auto; }
    .hrow { display: grid; grid-template-columns: 16px 64px minmax(0, 1fr); gap: 0 8px; padding: 5px 10px; border-bottom: 1px solid var(--line-soft); align-items: baseline; }
    .hrow .hmark { color: var(--live); text-align: center; }
    .hrow.fail .hmark { color: var(--red); }
    .hrow .htime { font: var(--fs-xs) var(--mono); color: var(--faint); }
    .hrow .hwhat { font-weight: 600; font-size: var(--fs-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hrow .hwhat .hsrc { color: var(--faint); font-weight: 400; }
    .hrow .hsum { grid-column: 3; color: var(--dim); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hrow .hdur { font: var(--fs-xs) var(--mono); color: var(--faint); font-weight: 400; }
    .hnote { padding: 8px 10px; color: var(--faint); font-size: var(--fs-xs); border-bottom: 1px solid var(--line-soft); }
    .hnote b { color: var(--dim); font-weight: 600; }

    /* Home: dashboard of app tiles (default) or list rows (G) */
    #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile-col), 1fr)); gap: 18px 8px; padding: 18px 10px;
             background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r-card); box-shadow: var(--card-shadow);
             -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
    .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; padding: 0; min-width: 0;
            color: var(--text); cursor: pointer; position: relative; text-align: center; }
    /* iOS squircle: corner radius 22.5% of the icon's width, in every style */
    .tile .icon { width: var(--tile); height: var(--tile); border-radius: 22.5%; display: flex; align-items: center; justify-content: center; flex: none;
                  background: var(--tile-bg); border: 1px solid var(--tile-line); box-shadow: var(--tile-shadow);
                  transition: transform 0.25s var(--spring), box-shadow 0.2s var(--ease); }
    .tile .icon svg { width: var(--tile-svg); height: var(--tile-svg); }
    @media (hover: hover) { .tile:hover .icon { transform: translateY(-2px); } }
    .tile:active .icon { transform: scale(0.95); transition-duration: 0.12s; }
    .tile:focus-visible { outline: none; } .tile:focus-visible .icon { outline: 2px solid var(--accent); outline-offset: 3px; }
    .tile .name { font-size: var(--fs-s); font-weight: 600; line-height: 1.2; max-width: calc(var(--tile-col) + 8px); text-transform: var(--label-case); letter-spacing: 0; }
    body[data-style=bold] .tile .name, body[data-style=bold] .controls-label, body[data-style=bold] .flabel, body[data-style=bold] #progress .ptitle { font-family: var(--mono); font-size: var(--fs-xs); letter-spacing: 0.08em; text-transform: uppercase; }
    .tile .sub, .tile .state { display: none; }
    .tile kbd { position: absolute; top: -6px; right: calc(50% - var(--tile) / 2 - 8px); opacity: 0; transition: opacity 0.15s; background: #000; }
    .tile:hover kbd, body.keys .tile kbd { opacity: 1; }
    .tile .badge { position: absolute; top: -4px; left: calc(50% + var(--tile) / 2 - 10px); width: 14px; height: 14px; border-radius: 7px;
                   background: var(--live); border: 2px solid #000; animation: breathe 1.6s ease-in-out infinite; }
    .tile .state.fail { color: var(--red); }
    /* List rows */
    #tiles.list { display: flex; flex-direction: column; gap: 0; padding: 4px 0; }
    #tiles.list .tile { display: grid; grid-template-columns: var(--row-icon) minmax(0, 1fr) auto auto; align-items: center; gap: 1px 12px;
                        padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line-soft); }
    #tiles.list .tile:last-child { border-bottom: 0; }
    #tiles.list .tile:hover { background: var(--surface-2); }
    #tiles.list .icon { width: var(--row-icon); height: var(--row-icon); border-radius: 22.5%; grid-row: span 2; }
    #tiles.list .icon svg { width: calc(var(--row-icon) * 0.76); height: calc(var(--row-icon) * 0.76); }
    #tiles.list .tile:hover .icon { transform: none; }
    #tiles.list .name { max-width: none; font-size: var(--fs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #tiles.list .sub { display: block; grid-column: 2; font-size: var(--fs-xs); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #tiles.list .state { display: block; grid-column: 3; grid-row: 1 / span 2; font: var(--fs-xs) var(--mono); color: var(--faint); white-space: nowrap; }
    #tiles.list .state.run { color: var(--live); } #tiles.list .state.paused { color: var(--warn); }
    #tiles.list kbd { position: static; grid-column: 4; grid-row: 1 / span 2; opacity: 1; background: none; }
    #tiles.list .badge { top: 0; bottom: 0; left: 0; width: 3px; height: auto; border-radius: 0; border: 0; animation: none; }
    /* Entrance: tiles rise in one after another, only when the panel first opens (body.intro,
       main.js). A CSS animation tied to a view showing restarts whenever that view or a class
       around it changes, which made the screen blink at the end of opening/closing an app. */
    body.intro:not([data-motion=off]) #home:not(.hidden) .tile { animation: rise 0.32s var(--ease) both; }
    #home .tile:nth-child(2) { animation-delay: 0.03s; } #home .tile:nth-child(3) { animation-delay: 0.06s; } #home .tile:nth-child(4) { animation-delay: 0.09s; }
    #home .tile:nth-child(5) { animation-delay: 0.12s; } #home .tile:nth-child(6) { animation-delay: 0.15s; } #home .tile:nth-child(7) { animation-delay: 0.18s; }
    #home .tile:nth-child(8) { animation-delay: 0.21s; } #home .tile:nth-child(9) { animation-delay: 0.24s; } #home .tile:nth-child(n+10) { animation-delay: 0.27s; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(0.97); } }
    body[data-style=studio] #home .tile, body[data-style=compact] #home .tile { animation: none !important; }

    /* App view */
    .card { padding: var(--pad); margin-bottom: var(--gap); }
    .card p.desc { margin: 0 0 10px; color: var(--dim); font-size: var(--fs-s); }
    .field { margin-bottom: var(--gap); }
    .field > .flabel { display: block; color: var(--dim); font-size: var(--fs-s); margin: 0 0 5px 3px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row input[type=text] { flex: 1; min-width: 0; }
    input[type=text] { width: 100%; height: var(--input); padding: 0 12px; color: var(--text); font: var(--fs-s) var(--mono);
            background: var(--field); border: 1px solid var(--line); border-radius: var(--r-input); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
    input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    input::placeholder { color: var(--faint); font-family: var(--font); }
    .skill-slot:not(:empty) { margin-top: 12px; }
    select.colour-select { width: 100%; height: var(--input); padding: 0 10px; color: var(--text); font: inherit; font-size: var(--fs-s);
            background: var(--field); border: 1px solid var(--line); border-radius: var(--r-input); outline: none; }
    select.colour-select option, select.colour-select optgroup { background: #1c1c1e; color: #fff; }

    /* Switches (checkbox inputs) */
    .toggles { margin-bottom: var(--gap); padding: 2px 12px; border-radius: var(--r-input); background: var(--field); border: 1px solid var(--line-soft); }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); cursor: pointer; }
    .toggle:first-child { border-top: 0; }
    .toggle .tlabel { font-size: var(--fs); }
    .switch { position: relative; flex: 0 0 auto; width: calc(var(--btn) * 1.45); height: calc(var(--btn) * 0.8); }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
    .switch .track { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 999px; background: rgba(120, 120, 128, 0.36); transition: background 0.2s var(--ease); }
    .switch .knob { position: absolute; top: 2px; left: 2px; width: calc(var(--btn) * 0.8 - 4px); height: calc(var(--btn) * 0.8 - 4px); border-radius: 999px; background: #fff;
                    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3); transition: transform 0.25s var(--spring); }
    .switch input:checked ~ .track { background: var(--accent); }
    .switch input:checked ~ .knob { transform: translateX(calc(var(--btn) * 0.65)); }
    .switch input:focus-visible ~ .track { box-shadow: 0 0 0 2px var(--accent); }

    /* Segmented control: the chosen one is white (Peny), like the old dashboard */
    .segmented { display: flex; padding: 2px; background: var(--field); border: 1px solid var(--line); border-radius: var(--r-input); flex-wrap: wrap; }
    .segmented button { flex: 1; min-height: calc(var(--input) - 6px); background: none; border: 0; color: var(--dim); font-size: var(--fs-s); padding: 2px 8px;
                        border-radius: calc(var(--r-input) - 2px); cursor: pointer; white-space: nowrap; transition: background 0.15s var(--ease), color 0.15s; }
    .segmented button:hover { color: var(--text); }
    .segmented button.on { background: var(--primary); color: var(--primary-text); font-weight: 600; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
    .segmented + input { margin-top: 6px; }

    /* Buttons: white primary (Peny), grey secondary, red for destructive */
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { height: var(--btn); border: 1px solid var(--line); border-radius: var(--r-btn); padding: 0 var(--btn-pad); font-size: var(--fs); font-weight: 600;
            cursor: pointer; color: var(--text); background: var(--surface-2); white-space: nowrap;
            transition: filter 0.15s, background 0.15s, transform 0.25s var(--spring); }
    .pill:hover:not(:disabled) { background: var(--surface-3); }
    .pill:active:not(:disabled) { transform: scale(0.97); transition-duration: 0.12s; }
    .pill.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); box-shadow: 0 4px 14px rgba(255, 255, 255, 0.12); }
    .pill.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--primary); }
    .pill.danger { background: var(--red); border-color: var(--red); color: #fff; }
    .pill.danger:hover:not(:disabled) { filter: brightness(1.1); background: var(--red); }
    body[data-style=studio] .pill.danger, body[data-style=compact] .pill.danger { background: none; border-color: rgba(255, 77, 66, 0.6); color: var(--red); }
    body[data-style=bold] .pill { border-width: 2px; } body[data-style=bold] .pill.secondary { background: none; border-color: #fff; }
    .pill.secondary { background: var(--surface-2); }
    .pill.small { height: calc(var(--btn) - 4px); padding: 0 calc(var(--btn-pad) - 4px); font-size: var(--fs-s); }
    .pill:disabled { opacity: 0.38; cursor: default; box-shadow: none; }
    .controls-label { color: var(--faint); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 6px 3px; }
    .status { margin-top: 10px; color: var(--dim); font-size: var(--fs-s); white-space: pre-wrap; }
    .status:empty { display: none; }

    /* App progress (above the log) */
    #progress { padding: 12px var(--pad); margin-bottom: var(--gap); }
    #progress .ptop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    #progress .ptitle { font-size: var(--fs-s); font-weight: 600; }
    #progress .pcount { font: var(--fs-s) var(--mono); color: var(--dim); }
    #progress .pcount b { color: var(--text); font-weight: 600; }
    .bar { height: calc(var(--fs) * 0.55); border-radius: 999px; background: rgba(0, 0, 0, 0.4); overflow: hidden; position: relative; }
    .bar .fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #9a9a9a, #fff); transition: width 0.5s linear; position: relative; overflow: hidden; }
    body[data-style=studio] .bar .fill, body[data-style=compact] .bar .fill { background: var(--accent); }
    /* A light sweeps along the bar while it runs (motion on only) */
    body:not([data-motion=off]) #progress.running .bar .fill::after, body:not([data-motion=off]) #jobs .jtask.running > .bar .fill::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 60%; left: -60%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent); animation: sweep 1.8s ease-in-out infinite; }
    @keyframes sweep { to { left: 110%; } }
    #progress.complete .fill { background: #fff; }
    #progress.failed .fill { background: linear-gradient(90deg, var(--warn), var(--red)); }
    #progress .psub { margin-top: 6px; font-size: var(--fs-xs); color: var(--faint); }
    #progress .psub:empty { display: none; }
    #progress .peta { margin-top: 6px; font: var(--fs-s) var(--mono); color: var(--text); }
    #progress .peta:empty { display: none; }

    /* Jobs in progress: a strip under the work area while something runs; the header folds it */
    #jobs { flex: none; display: flex; flex-direction: column; max-height: 42vh; margin: 0 var(--pad) var(--pad); border-radius: var(--r-card);
            background: rgba(18, 18, 18, 0.88); border: 1px solid var(--card-line); }
    body[data-style=compact] #jobs { margin: 0; border-radius: 0; border-width: 1px 0 0; }
    #jobs .jhead { flex: none; display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px var(--pad); background: none; border: 0;
                   color: var(--text); cursor: pointer; text-align: left; }
    #jobs .jtitle { font-size: var(--fs-s); font-weight: 700; white-space: nowrap; }
    #jobs .jsum { flex: 1; min-width: 0; font: var(--fs-xs) var(--mono); color: var(--dim); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #jobs .jchev { width: 14px; height: 14px; flex: none; color: var(--faint); transition: transform 0.2s var(--ease); }
    #jobs.min .jchev { transform: rotate(180deg); }
    #jobs.min .jbody { display: none; }
    #jobs .jbody { overflow-y: auto; padding: 0 var(--pad) 10px; }
    #jobs .jtask { padding: 8px 0; border-top: 1px solid var(--line-soft); }
    #jobs .jrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 5px; }
    #jobs .jname { font-size: var(--fs-s); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #jobs .jval { font: var(--fs-xs) var(--mono); color: var(--dim); white-space: nowrap; }
    #jobs .jeta { margin-top: 5px; font: var(--fs-xs) var(--mono); color: var(--text); }
    #jobs .jclip { padding: 5px 0 0 10px; }
    #jobs .jclip .jname { font-weight: 400; color: var(--dim); font-family: var(--mono); font-size: var(--fs-xs); }
    #jobs .jclip .bar { height: 4px; }
    #jobs .jmore { font-size: var(--fs-xs); color: var(--faint); padding: 4px 0 0; }
    #jobs .jtask.failed .fill { background: var(--red); }

    /* Sheet (replaces window.confirm): Enter = OK, Esc = Cancel */
    #sheet { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, 0.55); display: flex;
             align-items: center; justify-content: center; padding: 16px; z-index: 10; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    body:not([data-motion=off]) #sheet:not(.hidden) { animation: fade 0.15s var(--ease) both; }
    body:not([data-motion=off]) #sheet:not(.hidden) .glass { animation: pop 0.25s var(--spring) both; }
    @keyframes fade { from { opacity: 0; } } @keyframes pop { from { opacity: 0; transform: scale(0.94); } }
    #sheet .glass { width: 100%; max-width: 400px; padding: 18px; background: rgba(22, 22, 22, 0.95); }
    #sheet h3 { margin: 0 0 8px; font-size: var(--fs-title); font-weight: 700; }
    #sheet .stext { color: var(--dim); font-size: var(--fs-s); white-space: pre-wrap; margin-bottom: 16px; }
    #sheet .buttons { justify-content: flex-end; }
    #sheet .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin-bottom: 12px; font-size: var(--fs-s); color: var(--dim); }
    #sheet .keys kbd { justify-self: start; font-size: 11px; }
    /* Style picker in the sheet */
    .styles { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 14px; }
    .styles button { display: grid; grid-template-columns: 54px 1fr auto; gap: 2px 12px; align-items: center; text-align: left; padding: 8px; cursor: pointer;
                     background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line-soft); border-radius: 12px; color: var(--text); }
    .styles button:hover { background: rgba(255, 255, 255, 0.08); }
    .styles button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .styles .sw { grid-row: span 2; width: 54px; height: 40px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); }
    .styles b { font-size: 14px; } .styles small { color: var(--dim); font-size: 12px; grid-column: 2; }
    .styles kbd { grid-row: span 2; grid-column: 3; }

    /* Interviews: one tile per job, a small dashboard like home */
    .subtiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 10px; padding: 20px 12px; margin-bottom: var(--gap); }
    .subtile .name { max-width: none; font-size: var(--fs); }
    .subtile .sub { display: block; color: var(--dim); font-size: var(--fs-xs); line-height: 1.25; max-width: 160px; margin-top: -3px; }
    .subtile kbd { top: -6px; }
    body[data-style=compact] .subtiles { gap: 10px 6px; padding: 10px 6px; }
    .card p.needs { margin: 0 0 12px; padding: 8px 12px; color: var(--text); font-size: var(--fs-s); background: var(--surface-2); border-radius: var(--r-input); }
    .runcard { padding: 0 4px; margin-bottom: var(--gap); }
    .runbox .controls-label { margin-top: 0; }
    .section-title { font-size: var(--fs); font-weight: 600; }
    .info-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; margin: 0 0 8px; }
    .info-head.slim { justify-content: flex-end; margin: -4px -4px 4px 0; min-height: 0; }
    .info-btn { flex: none; width: 24px; height: 24px; padding: 0; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
                background: var(--card); border: 1px solid var(--line); color: var(--dim); cursor: pointer; transition: transform 0.2s var(--spring), background 0.15s; }
    .info-btn:hover { color: var(--text); background: var(--surface-3); }
    .info-btn:active { transform: scale(0.9); }
    .info-btn[aria-expanded=true] { background: #fff; border-color: #fff; color: #000; }
    .info-btn svg { width: 12px; height: 12px; }
    .info-body { display: none; margin: 0 0 12px; }
    .info-body.open { display: block; }
    body:not([data-motion=off]) .info-body.open { animation: drop 0.2s var(--ease) both; }
    @keyframes drop { from { opacity: 0; transform: translateY(-4px); } }
    .card .info-body p.desc { margin: 0; padding: 10px 12px; font-size: var(--fs-s); line-height: 1.45; color: var(--dim);
                              background: var(--field); border: 1px solid var(--line-soft); border-radius: var(--r-input); }

    /* Skill modules' own controls (Colour LUT list, Selects colour swatches) */
    body .lut-opt.on { background: var(--primary); color: var(--primary-text); }
    body .lut-opt:hover { background: var(--surface-3); }
  </style>
</head>
<body data-view="home" data-style="studio">
  <header id="bar">
    <button class="ib" id="back" title="Back (Esc)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
    </button>
    <img class="logo" id="logo" title="Home (Esc)" src="assets/peny-logo@1x.png" srcset="assets/peny-logo@1x.png 1x, assets/peny-logo@2x.png 2x, assets/peny-logo@3x.png 3x" width="20" height="18" alt="Peny">
    <div class="crumb">
      <span id="home-title" title="Home (Esc)">Toolkit</span><span id="status">Loading…</span>
      <span class="sep">/</span><span class="nav-icon" id="nav-icon"></span><span id="nav-title"></span>
    </div>
    <span class="chip" id="chip"></span>
    <div class="tools">
      <button class="ib" id="btn-style" title="Style: Glass, Studio, Bold, Compact (S)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
      </button>
      <button class="ib" id="btn-view" title="Dashboard or list (G)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
      </button>
      <button class="ib" id="btn-layout" title="Log and History: bottom, side or hidden (L)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M2 10h12"/></svg>
      </button>
      <button class="ib" id="btn-history" title="History of runs (H)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9"/><path d="M2.5 2.5v2.2h2.2"/><path d="M8 5v3.2l2 1.3"/></svg>
      </button>
      <button class="ib" id="btn-keys" title="Keyboard shortcuts (?)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="1.5" y="4" width="13" height="8.5" rx="1.5"/><path d="M4 7h.01M6.5 7h.01M9 7h.01M11.5 7h.01M5 10h6"/></svg>
      </button>
    </div>
  </header>

  <div id="work">
    <div id="main">
      <section id="home" class="view">
        <div id="tiles"></div>
      </section>
      <section id="detail" class="view hidden">
        <div id="apps"></div>
        <div id="progress" class="glass hidden">
          <div class="ptop"><span class="ptitle">Proxies</span><span class="pcount" id="pcount"></span></div>
          <div class="bar"><div class="fill" id="pfill"></div></div>
          <div class="peta" id="peta"></div>
          <div class="psub" id="psub"></div>
        </div>
        <button id="homebar" title="Home" aria-label="Home"><span></span></button>
      </section>
    </div>
    <div id="split" title="Drag to resize"></div>
    <aside id="aux">
      <div class="auxbar">
        <button class="tab on" data-tab="log" title="Log (H toggles)">Log</button>
        <button class="tab" data-tab="history" title="History of runs (H)">History <span id="hist-count" class="num"></span></button>
        <span class="grow"></span>
        <span class="hint" id="aux-hint"></span>
      </div>
      <div id="log"></div>
      <div id="history" class="hidden"></div>
    </aside>
  </div>

  <div id="jobs" class="hidden">
    <button class="jhead" id="jobs-head" title="Fold / unfold">
      <span class="jtitle">Jobs</span><span class="jsum" id="jobs-sum"></span>
      <svg class="jchev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l5 5 5-5"/></svg>
    </button>
    <div class="jbody" id="jobs-body"></div>
  </div>

  <div id="sheet" class="hidden">
    <div class="glass">
      <h3 id="sheet-title"></h3>
      <div class="stext" id="sheet-text"></div>
      <div class="buttons"><button class="pill" id="sheet-cancel"></button><button class="pill" id="sheet-ok"></button></div>
    </div>
  </div>
  <script src="loader.js"></script>
</body>
</html>
