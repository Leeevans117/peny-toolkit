<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Peny Toolkit</title>
  <style>
    /* Dark "Liquid Glass" look: navy/slate backdrop, frosted translucent cards, pill buttons. */
    :root {
      /* Black and white, like the Peny logo. Red is kept only for Cancel/Detach. */
      --bg-mid: #000;
      --glass: rgba(255, 255, 255, 0.06); --glass-strong: rgba(255, 255, 255, 0.12);
      --glass-line: rgba(255, 255, 255, 0.18);
      --text: #ffffff; --dim: rgba(255, 255, 255, 0.66); --faint: rgba(255, 255, 255, 0.42);
      --blue: #ffffff; --blue-hi: #ffffff; --red: #ff453a; --green: #ffffff; --orange: #ff9f0a;
      --radius: 24px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--text); overflow: hidden;
      /* Mostly black, fading to white at the bottom. */
      background: linear-gradient(180deg, #000 0%, #000 58%, #161616 74%, #5a5a5a 90%, #bdbdbd 100%);
      background-color: #000; background-attachment: fixed;
      /* Rounded type to match the Peny logo (SF Pro Rounded is in /Library/Fonts on this Mac). */
      font: 13.5px/1.4 "SF Pro Rounded", "Avenir Next", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }
    .view { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow-y: auto; padding: 14px 14px 16px; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .glass {
      background: var(--glass); border: 1px solid var(--glass-line); border-radius: var(--radius);
      box-shadow: var(--shadow); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
    }

    /* Home */
    .home-head { padding: 6px 4px 14px; }
    .home-head h1 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
    .home-head h1 img { display: block; }
    #status { color: var(--dim); font-size: 12px; margin-top: 2px; }
    #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 16px 10px; padding: 18px 10px; }
    .tile { display: flex; flex-direction: column; align-items: center; gap: 7px; background: none; border: 0; padding: 0;
            color: var(--text); cursor: pointer; font: inherit; position: relative; }
    .tile .icon { width: 62px; height: 62px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
                  border: 1px solid rgba(255,255,255,0.22); box-shadow: 0 6px 16px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.12);
                  transition: transform 0.12s ease; }
    .tile:hover .icon { transform: scale(1.05); }
    .tile:active .icon { transform: scale(0.94); }
    .tile .icon svg { width: 44px; height: 44px; }
    .tile .name { font-size: 12.5px; font-weight: 500; text-align: center; line-height: 1.2; max-width: 92px; }
    .tile .badge { position: absolute; top: -3px; right: calc(50% - 37px); width: 14px; height: 14px; border-radius: 7px;
                   background: #fff; border: 2px solid #000; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.45; } }

    /* App view */
    .navbar { display: flex; align-items: center; gap: 8px; margin: -2px -4px 12px; }
    .back { background: var(--glass); border: 1px solid var(--glass-line); color: var(--text); width: 34px; height: 34px;
            border-radius: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
            -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
    .back:hover { background: var(--glass-strong); }
    .back svg { width: 16px; height: 16px; }
    .nav-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .nav-icon { border: 1px solid rgba(255,255,255,0.22); } .nav-icon svg { width: 22px; height: 22px; }
    .nav-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }

    .card { padding: 14px 16px; margin-bottom: 12px; }
    .card p.desc { margin: 0 0 12px; color: var(--dim); font-size: 13px; }
    .field { margin-bottom: 12px; }
    .field > .flabel { display: block; color: var(--dim); font-size: 12px; margin: 0 0 5px 4px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row input[type=text] { flex: 1; min-width: 0; }
    input[type=text] { width: 100%; padding: 8px 12px; color: var(--text); font: inherit; font-size: 12px;
            background: rgba(0, 0, 0, 0.22); border: 1px solid var(--glass-line); border-radius: 12px; outline: none; }
    input[type=text]:focus { border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18); }
    input::placeholder { color: var(--faint); }
    .skill-slot:not(:empty) { margin-top: 14px; }
    select.colour-select { width: 100%; padding: 7px 10px; color: var(--text); font: inherit; font-size: 12px;
            background: rgba(0, 0, 0, 0.22); border: 1px solid var(--glass-line); border-radius: 12px; outline: none; }
    select.colour-select option, select.colour-select optgroup { background: #1c1c1e; color: #fff; }

    /* iOS toggle (checkbox inputs) */
    .toggles { margin-bottom: 12px; padding: 2px 12px; border-radius: 16px; background: rgba(0, 0, 0, 0.16); border: 1px solid rgba(255,255,255,0.07); }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0;
              border-top: 1px solid rgba(255,255,255,0.07); cursor: pointer; }
    .toggle:first-child { border-top: 0; }
    .toggle .tlabel { font-size: 13px; }
    .switch { position: relative; flex: 0 0 auto; width: 54px; height: 28px; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
    .switch .track { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 14px; background: rgba(120, 120, 128, 0.36); transition: background 0.2s; }
    .switch .knob { position: absolute; top: 2px; left: 2px; width: 32px; height: 24px; border-radius: 12px; background: #fff;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: transform 0.2s; }
    .switch input:checked ~ .track { background: #fff; }
    .switch input:checked ~ .knob { background: #000; }
    .switch input:checked ~ .knob { transform: translateX(18px); }
    .switch input:checked ~ .track { box-shadow: 0 0 12px rgba(255, 255, 255, 0.3); }

    /* Segmented control */
    .segmented { display: flex; padding: 2px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--glass-line); border-radius: 12px; }
    .segmented button { flex: 1; background: none; border: 0; color: var(--dim); font: inherit; font-size: 12.5px; padding: 6px 4px;
                        border-radius: 10px; cursor: pointer; white-space: nowrap; }
    .segmented button.on { background: #fff; color: #000; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
    .segmented + input { margin-top: 6px; }

    /* Pill buttons: blue primary, red destructive, grey glass secondary */
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { border: 1px solid transparent; border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 13px; font-weight: 600;
            cursor: pointer; color: #fff; transition: filter 0.12s, transform 0.08s; }
    .pill:active:not(:disabled) { transform: scale(0.97); }
    .pill:hover:not(:disabled) { filter: brightness(1.12); }
    .pill.primary { background: #fff; color: #000; box-shadow: 0 4px 14px rgba(255, 255, 255, 0.18); }
    .pill.danger { background: var(--red); box-shadow: 0 4px 14px rgba(255, 69, 58, 0.28); }
    .pill.secondary { background: var(--glass-strong); border-color: var(--glass-line); }
    .pill.small { padding: 7px 12px; font-size: 12px; }
    .pill:disabled { opacity: 0.38; cursor: default; box-shadow: none; }
    .controls-label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 6px 4px; }
    .status { margin-top: 10px; color: var(--dim); font-size: 12.5px; white-space: pre-wrap; }
    .status:empty { display: none; }

    /* Overall proxy progress (directly above the log) */
    #progress { padding: 12px 16px; margin-bottom: 10px; border-radius: 20px; }
    #progress .ptop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    #progress .ptitle { font-size: 13px; font-weight: 600; }
    #progress .pcount { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
    #progress .pcount b { color: var(--text); font-weight: 600; }
    .bar { height: 8px; border-radius: 4px; background: rgba(0, 0, 0, 0.3); overflow: hidden; }
    .bar .fill { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #9a9a9a, #fff);
                 transition: width 0.35s ease; }
    #progress.complete .fill { background: #fff; }
    #progress.failed .fill { background: linear-gradient(90deg, var(--orange), var(--red)); }
    #progress .psub { margin-top: 6px; font-size: 12px; color: var(--faint); }
    #progress .psub:empty { display: none; }
    #progress .peta { margin-top: 6px; font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
    #progress .peta:empty { display: none; }

    #log { padding: 10px 12px; height: 190px; overflow-y: auto; border-radius: 18px; background: rgba(0, 0, 0, 0.28);
           border: 1px solid rgba(255,255,255,0.08); background: rgba(0, 0, 0, 0.55); font: 12px/1.45 "SF Pro Rounded", "Avenir Next", sans-serif; font-variant-numeric: tabular-nums; white-space: pre-wrap;
           color: rgba(235, 240, 250, 0.75); }
    .ok { color: #ffffff !important; } .err { color: #ff6961 !important; } .warn { color: rgba(255, 255, 255, 0.55) !important; }

    /* Jobs in progress: dock at the bottom of every screen while something renders; the
       header minimises it to one line (remembered). */
    #jobs { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 5; border-radius: 20px;
            background: rgba(18, 18, 18, 0.82); display: flex; flex-direction: column; max-height: 48vh; }
    #jobs .jhead { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 14px; background: none; border: 0;
                   color: var(--text); font: inherit; cursor: pointer; text-align: left; }
    #jobs .jtitle { font-size: 13px; font-weight: 600; white-space: nowrap; }
    #jobs .jsum { flex: 1; min-width: 0; font-size: 12.5px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #jobs .jchev { width: 14px; height: 14px; flex: 0 0 auto; transition: transform 0.2s; }
    #jobs.min .jchev { transform: rotate(180deg); }
    #jobs.min .jbody { display: none; }
    #jobs .jbody { overflow-y: auto; padding: 0 14px 12px; }
    #jobs .jtask { padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255,255,255,0.08); margin-bottom: 8px; }
    #jobs .jrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    #jobs .jname { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #jobs .jval { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #jobs .jeta { margin-top: 5px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
    #jobs .jclip { padding: 6px 2px 4px; }
    #jobs .jclip .jname { font-weight: 500; color: var(--dim); }
    #jobs .jclip .bar { height: 5px; border-radius: 3px; }
    #jobs .jmore { font-size: 12px; color: var(--faint); padding: 4px 2px 0; }
    #jobs .jtask.failed .fill { background: linear-gradient(90deg, var(--orange), var(--red)); }

    /* Sheet (replaces window.confirm) */
    #sheet { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(5, 8, 15, 0.55); display: flex;
             align-items: center; justify-content: center; padding: 18px; z-index: 10;
             -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    #sheet .glass { width: 100%; max-width: 380px; padding: 18px; background: rgba(22, 22, 22, 0.92); border-radius: 26px; }
    #sheet h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    #sheet .stext { color: var(--dim); font-size: 12.5px; white-space: pre-wrap; margin-bottom: 16px; }
    #sheet .buttons { justify-content: flex-end; }
  </style>
</head>
<body>
  <section id="home" class="view">
    <div class="home-head">
      <h1><img src="assets/peny-logo@1x.png" srcset="assets/peny-logo@1x.png 1x, assets/peny-logo@2x.png 2x, assets/peny-logo@3x.png 3x" width="49" height="44" alt="Peny"><span>Toolkit</span></h1>
      <div id="status">Loading…</div>
    </div>
    <div id="tiles" class="glass"></div>
  </section>

  <section id="detail" class="view hidden">
    <div class="navbar">
      <button class="back" id="back" title="Home">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      </button>
      <div class="nav-icon" id="nav-icon"></div>
      <div class="nav-title" id="nav-title"></div>
    </div>
    <div id="apps"></div>
    <div id="progress" class="glass hidden">
      <div class="ptop"><span class="ptitle">Proxies</span><span class="pcount" id="pcount"></span></div>
      <div class="bar"><div class="fill" id="pfill"></div></div>
      <div class="peta" id="peta"></div>
      <div class="psub" id="psub"></div>
    </div>
    <div id="log"></div>
  </section>

  <div id="jobs" class="glass hidden">
    <button class="jhead" id="jobs-head" title="Minimise / expand">
      <span class="jtitle">Jobs in progress</span><span class="jsum" id="jobs-sum"></span>
      <svg class="jchev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l5 5 5-5"/></svg>
    </button>
    <div class="jbody" id="jobs-body"></div>
  </div>

  <div id="sheet" class="hidden">
    <div class="glass">
      <h3 id="sheet-title"></h3>
      <div class="stext" id="sheet-text"></div>
      <div class="buttons"><button class="pill" id="sheet-cancel"></button><button class="pill" id="sheet-ok"></button></div>
    </div>
  </div>
  <script src="loader.js"></script>
</body>
</html>
